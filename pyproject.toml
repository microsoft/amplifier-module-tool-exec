[project]
name = "amplifier-module-tool-exec"
version = "0.1.0"
description = "Bounded JavaScript orchestration through approved Amplifier tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["amplifier-core>=1.6.1", "quickjs-ng>=0.16.2.1,<1"]

[project.entry-points."amplifier.modules"]
tool-exec = "amplifier_module_tool_exec:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_exec"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.16.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
